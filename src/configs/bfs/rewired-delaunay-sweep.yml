# Rewired-Delaunay robustness sweep — evaluation only, no training.
#
# Evaluates the frozen best model on Delaunay graphs whose edges have been
# rewired to random long-range links with probability p, to find where BFS
# generalization breaks down. Nicknames encode p in permille: rd_800_p0050 is
# n=800, p=0.05.
#
# The delaunay/er/ws bins at the end are reference points measured in the same
# run, so the sweep can be compared against them without relying on numbers
# from an earlier run.
#
# Usage:
#   python -m src.experiments.train_bfs --cfg src/configs/bfs/rewired-delaunay-sweep.yml

RUN_NAME: "rewired-delaunay-sweep"
ALGORITHM: "bfs"

# Must match model-checkpoints/model-best.ckpt exactly, or loading will fail.
MODEL:
  DECODER_USE_LAST_HIDDEN: True
  PROCESSOR_USE_LAST_HIDDEN: True
  HIDDEN_DIM: 256
  EDGE_DECODER_FP64: False
  HINT_INJECTION_MODE: "additive"
  PROCESSOR:
    NAME: "PGN"
    RESIDUAL: False
    KWARGS: [{ "aggr": "max" }]
    LAYERNORM:
      ENABLE: True
      MODE: "node"
  LATENT_NOISE_STD: 0.015
  MSG_PASSING_STEPS: 1
  TEACHER_FORCING:
    ENABLE: True
    HINT_DROPOUT: 0.4
  AUTOREGRESSIVE:
    ENABLE: True
    POINTER: False
  LAST_HIDDEN_MODE: "current"
  GRU:
    ENABLE: True

DATA:
  # Not trained on — kept minimal because setup_and_train still builds the
  # train split to read specs off it.
  TRAIN:
    NUM_SAMPLES: [10]
    GRAPH_GENERATOR: ["er"]
    GENERATOR_PARAMS:
      - { "n": 16, "p_range": [0.173, 0.52], "directed": False, "acyclic": False, "weighted": False }
  # Not validated on — one cheap bin so the monitor metric resolves.
  VAL:
    NUM_SAMPLES: 5
    GRAPH_GENERATOR: ["er"]
    NICKNAME: ["er_16"]
    GENERATOR_PARAMS:
      - { "n": 16, "p_range": [0.173, 0.52], "directed": False, "acyclic": False, "weighted": False }
  TEST:
    NUM_SAMPLES: 30
    GRAPH_GENERATOR: [
      "rewired_delaunay", "rewired_delaunay", "rewired_delaunay", "rewired_delaunay",
      "rewired_delaunay", "rewired_delaunay", "rewired_delaunay", "rewired_delaunay",
      "rewired_delaunay", "rewired_delaunay", "rewired_delaunay", "rewired_delaunay",
      "rewired_delaunay", "rewired_delaunay", "rewired_delaunay", "rewired_delaunay",
      "rewired_delaunay", "rewired_delaunay", "rewired_delaunay", "rewired_delaunay",
      "rewired_delaunay", "rewired_delaunay", "rewired_delaunay", "rewired_delaunay",
      "delaunay", "delaunay", "er", "er", "ws", "ws"
    ]
    NICKNAME: [
      "rd_800_p0000", "rd_800_p0010", "rd_800_p0020", "rd_800_p0050",
      "rd_800_p0100", "rd_800_p0150", "rd_800_p0200", "rd_800_p0300",
      "rd_800_p0400", "rd_800_p0500", "rd_800_p0700", "rd_800_p1000",
      "rd_1600_p0000", "rd_1600_p0010", "rd_1600_p0020", "rd_1600_p0050",
      "rd_1600_p0100", "rd_1600_p0150", "rd_1600_p0200", "rd_1600_p0300",
      "rd_1600_p0400", "rd_1600_p0500", "rd_1600_p0700", "rd_1600_p1000",
      "delaunay_800", "delaunay_1600", "er_800", "er_1600", "ws_800", "ws_1600"
    ]
    GENERATOR_PARAMS:
      # --- rewired Delaunay, N = 800 ---
      - { "n": 800, "p": 0.0,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800, "p": 0.01, "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800, "p": 0.02, "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800, "p": 0.05, "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800, "p": 0.1,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800, "p": 0.15, "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800, "p": 0.2,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800, "p": 0.3,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800, "p": 0.4,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800, "p": 0.5,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800, "p": 0.7,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800, "p": 1.0,  "directed": False, "acyclic": False, "weighted": False }
      # --- rewired Delaunay, N = 1600 ---
      - { "n": 1600, "p": 0.0,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p": 0.01, "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p": 0.02, "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p": 0.05, "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p": 0.1,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p": 0.15, "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p": 0.2,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p": 0.3,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p": 0.4,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p": 0.5,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p": 0.7,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p": 1.0,  "directed": False, "acyclic": False, "weighted": False }
      # --- reference bins, matching the original eval config ---
      - { "n": 800,  "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800,  "p_range": [0.008, 0.025], "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p_range": [0.004, 0.0125], "directed": False, "acyclic": False, "weighted": False }
      - { "n": 800,  "p_range": [0.05, 0.2], "k": [4, 6, 8], "directed": False, "acyclic": False, "weighted": False }
      - { "n": 1600, "p_range": [0.05, 0.2], "k": [4, 6, 8], "directed": False, "acyclic": False, "weighted": False }

TRAIN:
  ENABLE: False
  LOAD_CHECKPOINT: "model-checkpoints/model-best.ckpt"
  PRECISION: "16-mixed"
  BATCH_SIZE: 32
  NUM_WORKERS: 8
  CHECKPOINT_MONITOR: "val/loss/{val_nickname}"
  CHECKPOINT_MONITOR_MODE: "min"
  LOSS:
    OUTPUT_LOSS_WEIGHT: 1.0
    HINT_LOSS_WEIGHT: 1.0
    HIDDEN_LOSS_WEIGHT: 0.0

TEST:
  # Small, because N=1600 bins have OOMed at larger test batch sizes before.
  BATCH_SIZE: 5

LOGGING:
  WANDB:
    PROJECT: "nar-experiments-finetuning"
    GROUP: "rewired-delaunay"
